[package]
name = "cvst"
version = "0.1.3"
edition = "2024"
rust-version = "1.94"
description = "CareerVector style library: style catalogue, contracts, Typst templates and style assets"
license = "FSL-1.1-ALv2"
readme = "README.md"
repository = "https://git.corbet.ch/corbet-fsl/cvst"
keywords = ["cv", "typst", "styles", "templates"]
categories = ["template-engine"]
build = "build.rs"
# Only the text files (toml, typ, md, json, txt) ship: the build embeds them. Showcase PDF/PNG renders and the
# fonts stay in the repository (fonts come from ctypst `document-fonts`).
# The owner's real CV records (content.toml, wording.toml, entries, drafts) ship ON PURPOSE: they are the
# marketing showcase. Never narrow this list to exclude them; see AGENTS.md.
include = ["/src", "/build.rs", "/outputs/**/*.toml", "/outputs/**/*.typ", "/outputs/**/*.md", "/.agent/typst/**/*.typ", "/.agent/typst/**/*.toml", "/.agent/typst/**/*.md", "/.agent/typst/**/*.json", "/.agent/typst/**/*.txt", "/README.md", "/LICENSE.md", "/LICENSES"]

[dependencies]
anyhow = "1.0"
cletter = "0.5"
regex = "1.12"
serde_json = "1.0"
toml = "1.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
